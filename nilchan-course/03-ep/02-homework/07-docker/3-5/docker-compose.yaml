services:
  application:
    build: .
    container_name: http-app
    environment:
      DB_URL: ${DB_URL}
    ports:
      - 8081:8081

  postgres:
    image: postgres:18-bookworm
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - ./pgdata:/var/lib/postgresql
